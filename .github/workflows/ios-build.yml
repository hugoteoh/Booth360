# 云端 Mac 自动编译：每次 push 到 main 自动产出可安装的 .ipa
# 在 GitHub 仓库页 → Actions → 最新一次运行 → Artifacts 下载 Booth360-unsigned-ipa
# Windows 上用 Sideloadly 装进 iPhone（详见 INSTALL_WITHOUT_MAC.md）
name: iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # 允许把 ipa 发布到 Releases

jobs:
  build-ipa:
    name: 编译 IPA（未签名）
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 注入版本号（0.2.<构建序号>，App 设置页可见，每次构建自动递增）
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 0.2.${GITHUB_RUN_NUMBER}" Booth360/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" Booth360/Info.plist
          echo "版本: 0.2.${GITHUB_RUN_NUMBER}"

      - name: 编译归档（不签名，签名在 Windows 端由 Sideloadly 完成）
        run: |
          set -o pipefail
          xcodebuild \
            -project Booth360.xcodeproj \
            -scheme Booth360 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Booth360.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: 打包 IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/Booth360.xcarchive/Products/Applications/Booth360.app" build/Payload/
          cd build
          zip -qry Booth360-unsigned.ipa Payload

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Booth360-unsigned-ipa
          path: build/Booth360-unsigned.ipa
          retention-days: 30

      - name: 发布到 latest Release（仓库 Releases 页永远是最新包）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest build/Booth360-unsigned.ipa --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit latest --title "Booth360 v0.2.${GITHUB_RUN_NUMBER}" --notes "云端自动构建 v0.2.${GITHUB_RUN_NUMBER} · commit ${GITHUB_SHA:0:7} · $(date '+%Y-%m-%d %H:%M') UTC（装好后在 App 设置→关于 核对此版本号）" --repo "$GITHUB_REPOSITORY"
          else
            gh release create latest build/Booth360-unsigned.ipa \
              --title "Booth360 最新构建" \
              --notes "云端自动构建 · commit ${GITHUB_SHA:0:7}。未签名 ipa，Windows 上用 Sideloadly 安装（见 INSTALL_WITHOUT_MAC.md）" \
              --repo "$GITHUB_REPOSITORY"
          fi

  unit-tests:
    name: 单元测试（模拟器）
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 运行测试
        run: |
          set -o pipefail
          # 动态选第一台可用 iPhone 模拟器（runner 镜像更新换代也不受影响）
          DEST_ID=$(xcrun simctl list devices available | grep -E "iPhone" | head -n 1 | grep -oE "[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}")
          if [ -z "$DEST_ID" ]; then
            echo "找不到可用的 iPhone 模拟器："
            xcrun simctl list devices
            exit 1
          fi
          echo "使用模拟器: $DEST_ID"
          xcodebuild test \
            -project Booth360.xcodeproj \
            -scheme Booth360 \
            -destination "id=$DEST_ID" \
            CODE_SIGNING_ALLOWED=NO
