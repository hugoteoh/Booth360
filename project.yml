name: Booth360
options:
  bundleIdPrefix: com.hugoteoh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic

targets:
  Booth360:
    type: application
    platform: iOS
    sources:
      - path: Booth360
    info:
      path: Booth360/Info.plist
      properties:
        CFBundleDisplayName: Booth360
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSCameraUsageDescription: Booth360 需要使用相机进行 360 视频拍摄。
        NSMicrophoneUsageDescription: Booth360 需要使用麦克风录制现场声音。
        NSPhotoLibraryAddUsageDescription: Booth360 需要把导出的成品视频保存到你的相册。
        NSLocalNetworkUsageDescription: Booth360 需要本地网络权限，以便同一 Wi-Fi 的电脑浏览器远程控制拍摄。
        NSBonjourServices:
          - _booth360._tcp
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hugoteoh.booth360
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  Booth360Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Booth360Tests
    dependencies:
      - target: Booth360
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hugoteoh.booth360.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  Booth360:
    build:
      targets:
        Booth360: all
        Booth360Tests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - Booth360Tests
